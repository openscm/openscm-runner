[project]
name = "openscm-runner"
version = "2.0.0a1"
description = "Standardised interfaces for running simple climate models (SCMs)"
authors = [
    { name = "Zebede Nicholls", email = "zebedee.nicholls@climate-energy-college.org" },
    { name = "Marit Sandstad", email = "marit.sandstad@cicero.oslo.no" },
]
license = { text = "3-Clause BSD License" }
requires-python = ">=3.10"
dependencies = [
    "exceptiongroup>=1.0.0 ; python_full_version < '3.11'",
    # If you use numpy, we suggest pinning to >2.1.0
    # based on the minimum supported python version
    "pandas>=2.2.0",  # pin based on minimum supported python version
]
readme = "README.md"
classifiers = [
    # Full list: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://openscm-runner.readthedocs.io"
Documentation = "https://openscm-runner.readthedocs.io"
Changelog = "https://openscm-runner.readthedocs.io/en/stable/changelog"
Repository = "https://github.com/openscm/openscm-runner"
Issues = "https://github.com/openscm/openscm-runner/issues"


[project.optional-dependencies]
magicc = [
    "pandas-openscm>=0.9.0",
    "pooch>=1.8.0",
    "pymagicc>=2.1.5",
    "xarray>=2024.7.0",
]
plots = [
    "matplotlib>=3.7.1",  # pin based on minimum supported python version
]
full = [
    "openscm-runner[magicc]",
    "openscm-runner[plots]",
]

[dependency-groups]
dev = [
    # Loosen these off and let uv.lock handle versions when we need to start upgrading
    # (pins here are all from copier, not because the pins are needed)
    "liccheck==0.9.2",
    "mypy==2.4.1",
    "pandas-stubs==2.3.3.260113",
    # Required for liccheck, see https://github.com/dhatim/python-license-check/pull/113
    "pip==24.3.1",
    "pre-commit==4.0.1",
    # Required for liccheck, see https://github.com/dhatim/python-license-check/pull/113
    "setuptools==75.6.0",
    "tomli==2.2.1 ; python_full_version < '3.11'",
    "tomli-w==1.2.0",
    "towncrier==24.8.0",
    "ty==0.0.33",
]
docs = [
    "attrs==25.3.0",
    "mkdocs-autorefs==1.4.4",
    "mkdocs-gen-files==0.6.1",
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-material==9.7.6",
    "mkdocs-section-index==0.3.12",
    "mkdocstrings-python-xref==2.1.1",
    "mkdocstrings-python==2.0.3",
    "properdocs==1.6.7",
    "pymdown-extensions==10.21.3",
    "ruff==0.15.12",
    "jupyterlab==4.4.5",
    "jupytext==1.17.2",
    "mkdocs-jupyter==0.25.1",
]
# For minimum test dependencies.
# These are used when running our minimum PyPI install tests.
tests-min = [
    "pytest==8.3.4",
    "python-dotenv==1.2.4",
]
tests-full = [
    "pytest-cov==6.0.0",
]
# Test dependencies
# (partly split because liccheck uses toml,
# which doesn't support inhomogeneous arrays).
tests = [
    {include-group = "tests-min"},
    {include-group = "tests-full"},
]
all-dev = [
    {include-group = "dev"},
    {include-group = "docs"},
    {include-group = "tests"},
]

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "src/openscm_runner",
    "LICENCE",
]

[tool.coverage.run]
source = ["openscm_runner"]
branch = true

[tool.coverage.report]
fail_under = 90
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING",
    # Type overloading lines
    "@overload",
    "\\.\\.\\.",

]

[tool.mypy]
strict = true
disallow_any_unimported = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
follow_imports = "normal"

[tool.ty.environment]
extra-paths = ["stubs"]
python-version = "3.10"

[tool.ty.rules]

[tool.ty.src]
include = ["src"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    # Each adapter group's tests and slow tests are deselected by default.
    # Keep this consistent with the `-m` in `.github/workflows/ci.yaml`
    # (`tests` and `tests-resolution-strategies` jobs)
    # and `.github/workflows/test-upstream-latest.yaml`.
    # Only one `-m` is used (the last one), so combine everything into one expression.
    "-m",
    "not magicc_ar6 and not slow",
]
markers = [
  "slow: slow tests (e.g. full ensembles), not run by default",
  "magicc_ar6: the MAGICC AR6 adapters' tests (they need MAGICC's AR6 setup, see docs/further-background/testing.md)",
]


[tool.ruff]
src = [
    "src",
]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "UP",
    "S",
]
unfixable = [
    "PD002",
]
ignore = [
    "D200",
    "D400",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"test*.py" = [
    "D",
    "S101",
    "PLR2004",
]
"docs/*" = [
    "D100",
    "E402",
    "S101",
]
"scripts/*" = [
    "S101",
]
"stubs/*" = [
    "PLR0913",
]

[tool.ruff.lint.isort]
known-first-party = [
    "src",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.towncrier]
package = "openscm_runner"
package_dir = "src"
filename = "docs/changelog.md"
directory = "changelog/"
title_format = "## OpenSCM-Runner {version} ({project_date})"
underlines = [
    "",
    "",
    "",
]
issue_format = "[#{issue}](https://github.com/openscm/openscm-runner/pull/{issue})"
type = [
    { directory = "breaking", name = "⚠️ Breaking Changes", showcontent = true },
    { directory = "deprecation", name = "🗑️ Deprecations", showcontent = true },
    { directory = "feature", name = "🆕 Features", showcontent = true },
    { directory = "improvement", name = "🎉 Improvements", showcontent = true },
    { directory = "fix", name = "🐛 Bug Fixes", showcontent = true },
    { directory = "docs", name = "📚 Improved Documentation", showcontent = true },
    { directory = "trivial", name = "🔧 Trivial/Internal Changes", showcontent = false },
]

[tool.liccheck]
authorized_licenses = [
    "bsd",
    "bsd license",
    "BSD 3-Clause",
    "BSD-3-Clause",
    # numpy special case
    "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0",
    "CC0",
    "apache",
    "apache 2.0",
    "apache-2.0",
    "apache software",
    "apache software license",
    "Apache License, Version 2.0",
    "CMU License (MIT-CMU)",
    "Historical Permission Notice and Disclaimer (HPND)",
    "isc",
    "isc license",
    "isc license (iscl)",
    "gnu lgpl",
    "lgpl with exceptions or zpl",
    "LGPLv2+",
    "GNU Lesser General Public License v2 (LGPLv2)",
    "GNU Lesser General Public License v2 or later (LGPLv2+)",
    "mit",
    "mit license",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "psf-2.0",
    "python software foundation",
    "python software foundation license",
    "The Unlicense (Unlicense)",
    "zpl 2.1",
]
unauthorized_licenses = [
    "agpl",
    "gnu agpl",
    "gpl v3",
    "gplv3",
    "gpl v2",
    "gplv2",
    "gpl v1",
    "gplv1",
]
