name: "Setup Python and uv"
description: "setup Python and uv"

inputs:
  python-version:
    description: "Python version to use"
    required: true
  uv-dependency-install-flags:
    description: "Flags to pass to uv when running `uv install`"
    required: true
  run-uv-install:
    description: "Should we run the uv install steps"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup uv
      id: setup-uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        version: "0.11.16"
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      if: ${{ (inputs.run-uv-install == 'true') }}
      run: |
        # `--locked`: fail if `uv.lock` is out of date.
        # pre-commit.ci skips the `uv-lock` hook (no network access there),
        # so this is where CI checks the lock file.
        uv sync --locked ${{ inputs.uv-dependency-install-flags }}
