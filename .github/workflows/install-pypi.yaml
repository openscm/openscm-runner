# Test installation of the latest version from PyPI works.
# We make sure that we run the tests that apply to the version we installed,
# rather than the latest tests in main.
# The reason we do this, is that we want this workflow to test
# that installing from PyPI leads to a correct installation.
# If we tested against main, the tests could fail
# because the tests from main require the new features in main to pass.
name: Test installation PyPI

on:
  workflow_dispatch:
  schedule:
    # * is a special character in YAML so you have to quote this string
    # This means At 03:00 on Wednesday.
    # see https://crontab.guru/#0_0_*_*_3
    - cron:  '0 3 * * 3'

jobs:
  test-pypi-install:
    name: Test PyPI install ${{ matrix.install.target }} (${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        # Test against all security and bugfix versions: https://devguide.python.org/versions/
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        # Check both 'library' install and the 'application' (i.e. locked) install.
        # `target-with-adapters` adds the extras the adapters need.
        install:
          - target: "openscm-runner"
            target-with-adapters: "openscm-runner[full]"
          - target: "openscm-runner[locked]"
            target-with-adapters: "openscm-runner[full-locked]"
    runs-on: "${{ matrix.os }}"
    steps:
    - name: Set up Python "${{ matrix.python-version }}"
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Install
      run: |
        # Install without a cache dir to get a 'fresh' install
        # and to avoid cache deserialisation warnings.
        pip install --no-cache-dir --upgrade pip wheel
        pip install --no-cache-dir "${{ matrix.install.target }}" 2>stderr.txt
    - name: Check no warnings
      if: matrix.os != 'windows-latest'
      run: |
        if grep -q "WARN" stderr.txt; then echo "Warnings in pip install output" && cat stderr.txt && exit 1; else exit 0; fi
    - name: Get version non-windows
      if: matrix.os != 'windows-latest'
      run: |
        INSTALLED_VERSION=`python -c 'import openscm_runner; print(f"v{openscm_runner.__version__}")'`
        echo $INSTALLED_VERSION
        echo "INSTALLED_VERSION=$INSTALLED_VERSION" >> $GITHUB_ENV
    - name: Get version windows
      if: matrix.os == 'windows-latest'
      run: |
        chcp 65001  # use utf-8
        python -c 'import openscm_runner; f = open("version.txt", "w"); f.write(f"INSTALLED_VERSION=v{openscm_runner.__version__}"); f.close()'
        echo "Showing version.txt"
        type version.txt
        type version.txt >> $env:GITHUB_ENV
    - name: Check installed version environment variable
      run: |
        echo "${{ env.INSTALLED_VERSION }}"
    # Note: until v0.14.0 is released, the latest release on PyPI is v0.13.x,
    # so this checks out v0.13.x's tests
    # and the adapter steps below install v0.13.x's extras and run its tests.
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ env.INSTALLED_VERSION }}
    - name: Test installation
      run: |
        which python
        python scripts/test-install.py
    - name: Install min test dependencies
      run: |
        pip install -r requirements-only-tests-min-locked.txt
    - name: Run tests
      env:
        # Don't need interactive plots
        MPLBACKEND: Agg
      run: |
        # Can't run doctests here because the paths are different.
        # This only runs with minimum test dependencies installed.
        # So this is really just a smoke test,
        # rather than a super thorough integration test.
        # You will have to make sure that your tests run
        # without all the extras installed for this to pass.
        pytest tests -r a -vv tests
    - name: Install all test dependencies
      run: |
        pip install -r requirements-only-tests-locked.txt
    - name: Run tests with extra test dependencies installed
      env:
        # Don't need interactive plots
        MPLBACKEND: Agg
      run: |
        # Can't run doctests here because the paths are different.
        pytest tests -r a -vv tests
    # Note: MAGICC AR6 has a Windows binary,
    # but it hasn't been run in CI on Windows before
    # (it may need extra runtime libraries).
    # The MAGICC downloads also aren't cached here
    # (unlike in ci.yaml, we haven't worked out the cache path on Windows),
    # so every job downloads them.
    - name: Install the adapters' dependencies
      run: |
        pip install --no-cache-dir "${{ matrix.install.target-with-adapters }}"
    - name: Install gfortran's libraries (the macOS MAGICC binary needs them)
      if: runner.os == 'macOS'
      run: brew install gcc
    - name: Run all tests, including each adapter group's tests
      # bash so that the empty `-m ""` is passed through on Windows too
      shell: bash
      env:
        # Don't need interactive plots
        MPLBACKEND: Agg
        MAGICC_AR6_DOWNLOAD_TOKEN: ${{ secrets.MAGICC_AR6_DOWNLOAD_TOKEN }}
      run: |
        # Can't run doctests here because the paths are different.
        # `-m ""` runs everything, including each adapter group's tests
        # and the slow tests (overriding `addopts` in `pyproject.toml`).
        # We may want to change this later
        # (e.g. it is a big matrix and each job runs the full MAGICC AR6 ensemble).
        pytest tests -r a -vv -m ""
