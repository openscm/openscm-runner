# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      - mkdir -p bin/magicc/magicc-v7.5.3
      - wget -O "bin/magicc/magicc-v7.5.3.tar.gz" "https://www.magicc.org/api/download?type=MAGICC7&token=${MAGICC_LINK_FROM_MAGICC_DOT_ORG}"
      - tar -xf bin/magicc/magicc-v7.5.3.tar.gz -C bin/magicc/magicc-v7.5.3
    post_install:
      # Use pip directly rather than poetry. poetry 2.x x readthedocs's
      # `virtualenvs.create false` config leaves docs-group packages
      # not importable by the sphinx-build python (silent installation
      # path mismatch). Pip-installing the project + docs group
      # explicitly avoids the issue entirely.
      - pip install -e ".[fair,fair2,magicc,ciceroscmpy,ciceroscmpy2]"
      - pip install
          myst-nb
          sphinx-book-theme
          sphinx-autodoc-typehints
          sphinx-autodocgen
          jupytext
          sphinx-copybutton

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/source/conf.py
